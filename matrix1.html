<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matrix Banner</title>
<style>
  body {
    margin: 0;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .banner {
    position: relative;
    width: 1584px;
    height: 396px;
    background: linear-gradient(90deg, #000000 40%, #001a00 100%);
    overflow: hidden;
    font-family: monospace;
  }
  .matrix {
    position: absolute;
    right: 0;
    top: 0;
    width: 60%;
    height: 100%;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,255,70,0.08) 0px,
      rgba(0,255,70,0.08) 2px,
      transparent 2px,
      transparent 6px
    );
    opacity: 0.4;
  }
  .rabbit {
    position: absolute;
    right: 120px;
    bottom: 40px;
    font-size: 80px;
    color: rgba(0,255,70,0.15);
  }
  .text {
    position: absolute;
    right: 100px;
    top: 50%;
    transform: translateY(-50%);
    color: rgba(0,255,70,0.8);
    font-size: 36px;
    letter-spacing: 3px;
  }
  .left-clear {
    position: absolute;
    left: 0;
    top: 0;
    width: 40%;
    height: 100%;
    background: linear-gradient(90deg, #000 80%, transparent);
  }
</style>
</head>
<body>
<div class="banner">
  <div class="left-clear"></div>
  <div class="matrix"></div>
  <div class="rabbit">🐇</div>
  <div class="text">THE MATRIX HAS YOU</div>
</div>
</body>
</html>
